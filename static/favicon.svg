<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#071F3D"/>
    </linearGradient>
    <linearGradient id="contGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#portGrad)"/>
  
  <!-- Container 3D Box Stack -->
  <!-- Top Container -->
  <rect x="14" y="16" width="36" height="14" rx="3" fill="url(#contGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="23" y1="16" x2="23" y2="30" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="32" y1="16" x2="32" y2="30" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8"/>
  <line x1="41" y1="16" x2="41" y2="30" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8"/>
  
  <!-- Bottom Left Container -->
  <rect x="14" y="34" width="16" height="14" rx="2" fill="#0D9488" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="22" y1="34" x2="22" y2="48" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8"/>
  
  <!-- Bottom Right Container -->
  <rect x="34" y="34" width="16" height="14" rx="2" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="42" y1="34" x2="42" y2="48" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Little pulse dot -->
  <circle cx="50" cy="14" r="4" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>
</svg>
